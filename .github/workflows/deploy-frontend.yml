name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@wave1
    with:
      app_path: frontend
      # cPanel Setup Node.js App — utilisateur sisadmin, racine sis-web.
      deploy_path: /home/sisadmin/sis-web
      health_check_url: https://sis-administration.com
      # NEXT_PUBLIC_* figé au build CI — jamais relu au runtime cPanel.
      build_env: |
        NEXT_PUBLIC_API_URL=https://v1.sis-administration.com/api/v1
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
