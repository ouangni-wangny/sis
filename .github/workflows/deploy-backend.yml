name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-backend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@wave1
    with:
      app_path: backend
      # cPanel : sous-domaine v1 sous public_html du compte sisadmin.
      deploy_path: /home/sisadmin/public_html/v1.sis-administration.com
      health_check_url: https://v1.sis-administration.com/up
      # API JSON : pas d’assets Vite à builder en CI.
      build_frontend_assets: false
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
